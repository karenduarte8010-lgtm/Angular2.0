@for (item of produtos(); track item.nome) {
  <app-produto 
  [nome]="item.nome" 
  [preco]="item.preco"
  (produtoSelecionado)="exibirProduto($event)"></app-produto>

}

<p><button (click)="adicionarProduto()">/AdionarProduto></button></p>
<p><button (click)="subtituirProdutos  ()">substituirLista</button></p>
<H2>Total de produtos: {{totalProdutos () }}</H2>
<h3>Valor total: R$ {{valorTotal()}}</h3>
